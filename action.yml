name: 'PushJJTRTS3'
description: 'Push jUnit Jacoco test results to S3'
inputs:
  aws-access-key-id:
    description: '🔑'
    required: true
  aws-secret-access-key:
    description: '🤫'
    required: true
  bucket-name:
    description: '🪣'
    required: true
  path-tests:
    description: '🛣️'
    required: true
  publisher-setup:
    description: '🫸🕸️🗃️'
    required: false
    default: false
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.aws-access-key-id }}
    - ${{ inputs.aws-secret-access-key }}
    - ${{ inputs.bucket-name }}
    - ${{ inputs.path-tests }}
    - ${{ inputs.publisher-setup }}
    - ${{ github.ref_name}}
    - ${{ github.repository}}
